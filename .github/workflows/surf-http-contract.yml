name: SURF HTTP integration contract

on:
  pull_request:
    paths:
      - "src/**"
      - "habitat_vln/**"
      - "tests/**"
      - ".github/workflows/surf-http-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  http-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10 for model-side smoke
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install minimal transport dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.23,<2.0" "Pillow>=9.0,<12"

      - name: Compile imported code without executing Habitat or model
        run: python -m compileall -q src tests habitat_vln test

      - name: Test real localhost model-server and evaluator-client contract with fake policy
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_evaluator_http_contract.py' -v

      - name: Model-server HTTP regression
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_http_service.py' -v
